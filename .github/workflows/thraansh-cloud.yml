name: THRAANSH Cloud Automation

on:
  workflow_dispatch:

  schedule:
    # GitHub cron uses UTC.
    # 01:25,03:25,... UTC = 06:55,08:55,... IST
    - cron: "25 1,3,5,7,9,11,13,15 * * *"

concurrency:
  group: thraansh-cloud-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  thraansh:

    runs-on: ubuntu-latest

    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: Asia/Kolkata

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout THRAANSH
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ======================================================
      # SYSTEM PACKAGES
      # ======================================================

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            ca-certificates \
            curl

          echo ""
          echo "FFMPEG:"
          ffmpeg -version | head -n 1

          echo ""
          echo "FFPROBE:"
          ffprobe -version | head -n 1


      # ======================================================
      # PYTHON REQUIREMENTS
      # ======================================================

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

          if [ -f requirements.txt ]; then

            echo "Installing requirements.txt"

            python -m pip install \
              -r requirements.txt

          else

            echo "requirements.txt not found."

          fi

          # Make absolutely sure Playwright exists.
          python -m pip install \
            --upgrade \
            playwright

          echo ""
          echo "Installed Playwright version:"

          python -c \
            "import importlib.metadata; print(importlib.metadata.version('playwright'))"


      # ======================================================
      # PLAYWRIGHT / CHROMIUM
      #
      # THIS IS THE IMPORTANT FIX FOR:
      #
      # BrowserType.launch:
      # Executable doesn't exist...
      # ======================================================

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "INSTALLING PLAYWRIGHT CHROMIUM"
          echo "=============================================="

          python -m playwright install \
            --with-deps \
            chromium

          echo ""
          echo "Playwright Chromium installation completed."


      # ======================================================
      # ACTUAL BROWSER LAUNCH TEST
      #
      # We do not simply trust installation.
      # We actually launch Chromium.
      # ======================================================

      - name: Verify Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VERIFYING PLAYWRIGHT CHROMIUM"
          echo "=============================================="

          python <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:

              print(
                  "Chromium executable:",
                  p.chromium.executable_path
              )

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              page = browser.new_page()

              page.set_content(
                  "<html><body>"
                  "<h1>THRAANSH</h1>"
                  "</body></html>"
              )

              text = page.locator("h1").inner_text()

              print(
                  "Browser test returned:",
                  text
              )

              if text != "THRAANSH":
                  raise RuntimeError(
                      "Chromium browser verification failed."
                  )

              browser.close()

          print(
              "THRAANSH PLAYWRIGHT CHROMIUM: PASS"
          )
          PY


      # ======================================================
      # YOUTUBE TOKEN
      # ======================================================

      - name: Restore YouTube OAuth token
        shell: bash
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          set -euo pipefail

          if [ -z "${YOUTUBE_TOKEN_JSON:-}" ]; then

            echo "::error::YOUTUBE_TOKEN_JSON secret is missing."

            exit 1

          fi

          mkdir -p youtube

          printf '%s' \
            "$YOUTUBE_TOKEN_JSON" \
            > youtube/token.json

          cp \
            youtube/token.json \
            youtube/youtube_token.json

          chmod 600 \
            youtube/token.json

          chmod 600 \
            youtube/youtube_token.json

          python <<'PY'
          import json
          from pathlib import Path

          token_file = Path(
              "youtube/token.json"
          )

          with token_file.open(
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise RuntimeError(
                  "YouTube token JSON is invalid."
              )

          print(
              "YouTube OAuth token restored "
              "and JSON validated."
          )
          PY


      # ======================================================
      # DIRECTORY PREPARATION
      # ======================================================

      - name: Prepare THRAANSH directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            logs \
            audio \
            footage \
            output \
            outputs \
            video_output \
            temp \
            tmp \
            data \
            youtube

          echo "THRAANSH directories prepared."


      # ======================================================
      # PREFLIGHT
      # ======================================================

      - name: Verify THRAANSH environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "THRAANSH PREFLIGHT"
          echo "=============================================="

          python --version

          ffmpeg -version \
            | head -n 1

          ffprobe -version \
            | head -n 1

          echo ""
          echo "Checking production files..."

          test -f \
            youtube/token.json

          test -f \
            run_pipeline/run_pipeline.py

          test -f \
            scripts/hindi_presenter.py

          test -f \
            voice/generator.py

          test -f \
            scripts/scene_planner.py

          test -f \
            footage/multi_scene_generator.py

          test -f \
            video/multi_generator.py

          test -f \
            copyright/rights_checker.py

          test -f \
            youtube/uploader.py

          echo ""
          echo "Checking Python syntax..."

          python -m py_compile \
            run_pipeline/run_pipeline.py \
            scripts/hindi_presenter.py \
            voice/generator.py \
            scripts/scene_planner.py \
            footage/multi_scene_generator.py \
            video/multi_generator.py \
            copyright/rights_checker.py \
            youtube/uploader.py

          echo ""
          echo "=============================================="
          echo "THRAANSH PREFLIGHT: PASS"
          echo "=============================================="


      # ======================================================
      # FINAL PLAYWRIGHT CHECK DIRECTLY BEFORE PRODUCTION
      #
      # Protects against browser/cache/path problems.
      # ======================================================

      - name: Final browser health check
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:

              executable = Path(
                  p.chromium.executable_path
              )

              print(
                  "Expected Chromium:",
                  executable
              )

              if not executable.exists():

                  raise RuntimeError(
                      "Playwright Chromium executable "
                      "is missing before production."
                  )

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              browser.close()

          print(
              "FINAL BROWSER HEALTH CHECK: PASS"
          )
          PY


      # ======================================================
      # PRODUCTION
      # ======================================================

      - name: Run THRAANSH production
        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}

          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "THRAANSH FRESH VIDEO PRODUCTION"
          echo "=============================================="

          python \
            run_pipeline/run_pipeline.py \
            --run-now


      # ======================================================
      # DURABLE STATE
      #
      # Preserve runtime JSON without git pull --rebase.
      # ======================================================

      - name: Persist THRAANSH durable state
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "THRAANSH Cloud Worker"

          git config \
            user.email \
            "thraansh.media@gmail.com"

          STATE_DIR="$(
            mktemp -d
          )"

          STATE_FILES=(
            "data/article_queue.json"
            "data/automation_state_v7.json"
          )

          echo ""
          echo "Saving runtime state temporarily..."

          for file in \
            "${STATE_FILES[@]}"
          do

            if [ -f "$file" ]; then

              mkdir -p \
                "$STATE_DIR/$(dirname "$file")"

              cp \
                "$file" \
                "$STATE_DIR/$file"

            fi

          done


          for attempt in \
            1 2 3 4 5
          do

            echo ""
            echo \
              "State save attempt ${attempt}/5"

            git fetch \
              origin \
              main

            git reset \
              --hard \
              origin/main


            for file in \
              "${STATE_FILES[@]}"
            do

              if [ -f \
                "$STATE_DIR/$file" ]
              then

                mkdir -p \
                  "$(dirname "$file")"

                cp \
                  "$STATE_DIR/$file" \
                  "$file"

              fi

            done


            for file in \
              "${STATE_FILES[@]}"
            do

              if [ -f "$file" ]; then

                git add \
                  "$file"

              fi

            done


            if git diff \
                --cached \
                --quiet
            then

              echo ""
              echo \
                "No THRAANSH state changes."

              exit 0

            fi


            git commit \
              -m \
              "Update THRAANSH cloud state [skip ci]"


            if git push \
                origin \
                HEAD:main
            then

              echo ""
              echo "=============================================="
              echo "THRAANSH STATE SAVE: SUCCESS"
              echo "=============================================="

              exit 0

            fi


            echo ""
            echo \
              "GitHub changed while saving state."

            echo \
              "Retrying with newest main..."

            sleep \
              $((attempt * 3))

          done


          echo ""
          echo "::error::State save failed after 5 attempts."

          exit 1


      # ======================================================
      # DEBUG INFORMATION
      # ======================================================

      - name: Capture failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          echo "=============================================="
          echo "THRAANSH FAILURE DIAGNOSTICS"
          echo "=============================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Playwright:"
          python -c \
            "import importlib.metadata; print(importlib.metadata.version('playwright'))"

          echo ""
          echo "Chromium path:"

          python <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:

              path = Path(
                  p.chromium.executable_path
              )

              print(path)
              print(
                  "Exists:",
                  path.exists()
              )
          PY

          echo ""
          echo "Playwright cache:"

          find \
            "$HOME/.cache/ms-playwright" \
            -maxdepth 4 \
            -type f \
            2>/dev/null \
            | head -n 100

          echo ""
          echo "Disk:"
          df -h

          echo ""
          echo "Memory:"
          free -h || true


      # ======================================================
      # LOGS
      # ======================================================

      - name: Upload THRAANSH logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thraansh-cloud-logs-${{ github.run_number }}
          path: |
            logs/
          if-no-files-found: ignore
          retention-days: 5