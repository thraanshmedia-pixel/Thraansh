name: THRAANSH Cloud Automation

on:
  workflow_dispatch:

  schedule:
    # 5 minutes BEFORE every THRAANSH slot
    # IST: 06:55, 08:55, 10:55, 12:55, 14:55, 16:55, 18:55, 20:55
    - cron: "25 1,3,5,7,9,11,13,15 * * *"

    # 5 minutes AFTER every THRAANSH slot
    # IST: 07:05, 09:05, 11:05, 13:05, 15:05, 17:05, 19:05, 21:05
    - cron: "35 1,3,5,7,9,11,13,15 * * *"

permissions:
  contents: write

concurrency:
  group: thraansh-cloud-automation
  cancel-in-progress: false

jobs:

  thraansh:

    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      TZ: Asia/Kolkata

    steps:

      - name: Checkout THRAANSH
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-dejavu-core \
            fonts-liberation \
            fonts-noto-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Restore YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "ERROR: YOUTUBE_TOKEN_JSON GitHub secret is missing."
            exit 1
          fi

          mkdir -p youtube

          printf '%s' "$YOUTUBE_TOKEN_JSON" > youtube/token.json
          cp youtube/token.json youtube/youtube_token.json

          chmod 600 youtube/token.json
          chmod 600 youtube/youtube_token.json

          echo "YouTube OAuth token restored."

      - name: Verify environment
        run: |
          python --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

          test -f youtube/token.json

          echo "THRAANSH cloud environment ready."

      - name: Run THRAANSH immediately
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}

          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

        run: |
          python run_pipeline/run_pipeline.py --run-now

      - name: Persist THRAANSH cloud state
        if: always()
        run: |
          git config user.name "THRAANSH Cloud Worker"
          git config user.email "thraansh.media@gmail.com"

          git add data/article_queue.json || true
          git add data/automation_state_v7.json || true

          git status --short

          if git diff --cached --quiet; then
            echo "No THRAANSH state changes to save."
          else
            git commit -m "Update THRAANSH cloud automation state [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload THRAANSH logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thraansh-cloud-logs-${{ github.run_number }}
          path: |
            logs/
          if-no-files-found: ignore
          retention-days: 5