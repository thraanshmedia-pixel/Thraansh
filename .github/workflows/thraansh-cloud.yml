name: THRAANSH Cloud Automation

on:
  workflow_dispatch:

  schedule:
    # ========================================================
    # THRAANSH MAIN PUBLISHING SLOTS
    #
    # GitHub cron is UTC.
    #
    # IST:
    # 07:00
    # 09:00
    # 11:00
    # 13:00
    # 15:00
    # 17:00
    # 19:00
    # 21:00
    # ========================================================

    - cron: "30 1,3,5,7,9,11,13,15 * * *"

    # ========================================================
    # AUTOMATIC RECOVERY RUN
    #
    # 20 minutes after every publishing slot.
    #
    # If the first run succeeded, the worker sees the slot
    # as complete and does not intentionally republish it.
    #
    # If a temporary API failure occurred, this gives the
    # cloud another opportunity within the publication
    # grace window.
    # ========================================================

    - cron: "50 1,3,5,7,9,11,13,15 * * *"


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: write


# ============================================================
# PREVENT TWO THRAANSH WORKERS RUNNING TOGETHER
# ============================================================

concurrency:
  group: thraansh-cloud-automation
  cancel-in-progress: false


# ============================================================
# JOB
# ============================================================

jobs:

  thraansh:

    runs-on: ubuntu-latest

    timeout-minutes: 120

    env:

      PYTHONUTF8: "1"

      PYTHONIOENCODING: "utf-8"

      TZ: Asia/Kolkata


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout THRAANSH

        uses: actions/checkout@v4

        with:

          fetch-depth: 0


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: "pip"


      # ======================================================
      # SYSTEM DEPENDENCIES
      # ======================================================

      - name: Install system dependencies

        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-dejavu-core \
            fonts-liberation \
            fonts-noto-core


      # ======================================================
      # PYTHON DEPENDENCIES
      # ======================================================

      - name: Install Python dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # PLAYWRIGHT
      # ======================================================

      - name: Install Playwright Chromium

        run: |

          python -m playwright install --with-deps chromium


      # ======================================================
      # RESTORE YOUTUBE OAUTH TOKEN
      #
      # This is critical for laptop-OFF operation.
      # There can be no browser login inside GitHub Actions.
      # ======================================================

      - name: Restore YouTube OAuth token

        env:

          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

        run: |

          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then

            echo "ERROR: YOUTUBE_TOKEN_JSON GitHub secret is missing."

            exit 1

          fi

          mkdir -p youtube

          printf '%s' "$YOUTUBE_TOKEN_JSON" > youtube/token.json

          cp youtube/token.json youtube/youtube_token.json

          chmod 600 youtube/token.json

          chmod 600 youtube/youtube_token.json

          echo "YouTube OAuth token restored."


      # ======================================================
      # ENVIRONMENT CHECK
      # ======================================================

      - name: Verify environment

        run: |

          python --version

          ffmpeg -version | head -n 1

          ffprobe -version | head -n 1

          test -f youtube/token.json

          echo "THRAANSH cloud environment ready."


      # ======================================================
      # THRAANSH WORKER
      # ======================================================

      - name: Run THRAANSH worker

        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}

          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}

          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

        run: |

          python run_pipeline/run_pipeline.py --worker


      # ======================================================
      # SAVE DURABLE QUEUE + AUTOMATION STATE
      #
      # GitHub runners are temporary.
      # These files must be pushed back to GitHub so the
      # following scheduled run remembers what happened.
      # ======================================================

      - name: Persist THRAANSH cloud state

        if: always()

        run: |

          git config user.name "THRAANSH Cloud Worker"

          git config user.email "thraansh.media@gmail.com"

          git add data/article_queue.json || true

          git add data/automation_state_v7.json || true

          git status --short

          if git diff --cached --quiet; then

            echo "No THRAANSH state changes to save."

          else

            git commit -m "Update THRAANSH cloud automation state [skip ci]"

            git pull --rebase origin main

            git push origin main

          fi


      # ======================================================
      # SAVE LOGS FOR TROUBLESHOOTING
      # ======================================================

      - name: Upload THRAANSH logs

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: thraansh-cloud-logs-${{ github.run_number }}

          path: |

            logs/

          if-no-files-found: ignore

          retention-days: 5