name: THRAANSH Cloud Automation

on:
  workflow_dispatch:

  schedule:
    # GitHub cron uses UTC.
    #
    # IST publishing slots:
    # 07:00 09:00 11:00 13:00
    # 15:00 17:00 19:00 21:00
    #
    # UTC:
    # 01:30 03:30 05:30 07:30
    # 09:30 11:30 13:30 15:30
    - cron: "30 1,3,5,7,9,11,13,15 * * *"

permissions:
  contents: write

concurrency:
  group: thraansh-production
  cancel-in-progress: false

jobs:

  thraansh:

    runs-on: ubuntu-latest

    # A broken story must never occupy the system for hours.
    timeout-minutes: 25

    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Kolkata

    steps:

      # ======================================================
      # SOURCE
      # ======================================================

      - name: Checkout THRAANSH
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python requirements
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # FFMPEG
      # ======================================================

      - name: Prepare media tools
        shell: bash
        run: |
          set -e

          if command -v ffmpeg >/dev/null 2>&1 && \
             command -v ffprobe >/dev/null 2>&1; then

            echo "FFmpeg already installed."

          else

            echo "Installing FFmpeg..."

            sudo apt-get update -qq

            sudo apt-get install -y \
              --no-install-recommends \
              ffmpeg \
              fonts-noto-core \
              fonts-dejavu-core \
              fonts-liberation

          fi

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      # ======================================================
      # YOUTUBE TOKEN
      # ======================================================

      - name: Restore YouTube OAuth token
        shell: bash
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          set -e

          if [ -z "${YOUTUBE_TOKEN_JSON:-}" ]; then
            echo "YOUTUBE_TOKEN_JSON secret is missing."
            exit 1
          fi

          mkdir -p youtube

          printf '%s' "$YOUTUBE_TOKEN_JSON" \
            > youtube/token.json

          cp youtube/token.json \
             youtube/youtube_token.json

          chmod 600 youtube/token.json
          chmod 600 youtube/youtube_token.json

          echo "YouTube OAuth restored."

      # ======================================================
      # CRITICAL FRESH-RUN RESET
      #
      # GitHub runners are temporary.
      #
      # production_selected from an older runner must NEVER
      # cause the new runner to expect yesterday's MP3,
      # footage or final MP4.
      #
      # Published history is preserved.
      # ======================================================

      - name: Reset stale production selection
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/article_queue.json")

          if not path.exists():
              print("No queue yet.")
              raise SystemExit(0)

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          wrapper = None

          if isinstance(data, list):
              articles = data

          elif isinstance(data, dict):

              for key in (
                  "articles",
                  "items",
                  "queue",
                  "data",
              ):
                  if isinstance(
                      data.get(key),
                      list
                  ):
                      wrapper = key
                      articles = data[key]
                      break
              else:
                  print(
                      "Unknown queue format. "
                      "No reset performed."
                  )
                  raise SystemExit(0)

          else:
              print(
                  "Unknown queue format. "
                  "No reset performed."
              )
              raise SystemExit(0)

          cleared = 0

          for article in articles:

              if not isinstance(
                  article,
                  dict
              ):
                  continue

              # Published records remain untouched.
              published = (
                  bool(
                      str(
                          article.get(
                              "youtube_video_id"
                          )
                          or ""
                      ).strip()
                  )
                  or
                  str(
                      article.get(
                          "youtube_upload_status"
                      )
                      or ""
                  ).upper()
                  == "PUBLISHED"
              )

              if published:
                  continue

              if article.get(
                  "production_selected"
              ) is True:

                  article[
                      "production_selected"
                  ] = False

                  cleared += 1

          if wrapper:
              data[wrapper] = articles
              output = data
          else:
              output = articles

          path.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              "Old production selections cleared:",
              cleared
          )

          print(
              "Fresh story will be selected "
              "inside this runner."
          )
          PY

      # ======================================================
      # PREFLIGHT
      # ======================================================

      - name: Verify THRAANSH environment
        shell: bash
        run: |
          set -e

          python --version

          test -f youtube/token.json
          test -f run_pipeline/run_pipeline.py
          test -f scripts/hindi_presenter.py
          test -f voice/generator.py
          test -f scripts/scene_planner.py
          test -f footage/multi_scene_generator.py
          test -f video/multi_generator.py
          test -f copyright/rights_checker.py
          test -f youtube/uploader.py

          python -m py_compile \
            run_pipeline/run_pipeline.py

          echo "THRAANSH PREFLIGHT: PASS"

      # ======================================================
      # COMPLETE VIDEO PRODUCTION
      # ======================================================

      - name: Run THRAANSH production
        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}

          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "THRAANSH FRESH VIDEO PRODUCTION"
          echo "=============================================="

          python \
            run_pipeline/run_pipeline.py \
            --run-now

      # ======================================================
      # SAVE ONLY DURABLE STATE
      #
      # NO git pull --rebase.
      #
      # This avoids the recurring JSON rebase conflicts.
      # ======================================================

      - name: Persist THRAANSH durable state
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "THRAANSH Cloud Worker"

          git config \
            user.email \
            "thraansh.media@gmail.com"

          STATE_DIR="$(mktemp -d)"

          STATE_FILES=(
            "data/article_queue.json"
            "data/automation_state_v7.json"
          )

          for file in "${STATE_FILES[@]}"; do

            if [ -f "$file" ]; then

              mkdir -p \
                "$STATE_DIR/$(dirname "$file")"

              cp \
                "$file" \
                "$STATE_DIR/$file"

            fi

          done

          for attempt in 1 2 3 4 5; do

            echo ""
            echo "State save attempt ${attempt}/5"

            git fetch origin main

            # Start from newest code.
            git reset --hard origin/main

            # Restore only runtime JSON produced in this run.
            for file in "${STATE_FILES[@]}"; do

              if [ -f "$STATE_DIR/$file" ]; then

                mkdir -p \
                  "$(dirname "$file")"

                cp \
                  "$STATE_DIR/$file" \
                  "$file"

              fi

            done

            git add \
              data/article_queue.json \
              data/automation_state_v7.json \
              2>/dev/null || true

            if git diff \
                --cached \
                --quiet
            then

              echo "No state changes."
              exit 0

            fi

            git commit \
              -m \
              "Update THRAANSH cloud state [skip ci]"

            if git push \
                origin \
                HEAD:main
            then

              echo ""
              echo "THRAANSH STATE SAVE: SUCCESS"

              exit 0

            fi

            echo \
              "GitHub changed while saving. Retrying..."

            sleep $((attempt * 3))

          done

          echo \
            "State save failed after 5 attempts."

          exit 1

      # ======================================================
      # LOGS
      # ======================================================

      - name: Upload THRAANSH logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thraansh-cloud-logs-${{ github.run_number }}
          path: |
            logs/
          if-no-files-found: ignore
          retention-days: 5

